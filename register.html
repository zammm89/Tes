<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <!-- Penting: Script Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="register-container">
        <h2 id="txtTitle">Daftar Akun</h2>
        <p id="txtSubtitle">Buat akun baru Anda</p>

        <form id="registerForm">
            <label id="lblFullname">Nama Lengkap</label>
            <input type="text" id="inputFullname" placeholder="Masukkan nama" required>

            <label id="lblEmail">Email</label>
            <input type="email" id="inputEmail" placeholder="Masukkan email" required>

            <label id="lblPassword">Password</label>
            <input type="password" id="inputPassword" placeholder="Buat password" required>

            <button type="submit" id="btnSubmit">Daftar</button>
        </form>

        <!-- Pesan Error -->
        <div id="errorMessage" style="color: red; display: none; margin-top: 10px;"></div>

        <div class="divider">atau</div>

        <!-- Tombol Google -->
        <button type="button" class="google-btn" onclick="loginWithGoogle()">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
            <span id="txtGoogleBtn">Daftar dengan Google</span>
        </button>

        <p><span id="txtSwitch">Sudah punya akun?</span> <a href="login.html" id="linkSwitch">Masuk sekarang</a></p>
    </div>

    <script src="register.js"></script>
</body>
</html>
