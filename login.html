<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Penting: Script Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <h2 id="txtTitle">Log In</h2>
        <p id="txtSubtitle">Masuk ke akun Anda</p>

        <form id="loginForm">
            <label id="lblEmail">Email</label>
            <input type="email" id="inputEmail" placeholder="Masukkan email" required>

            <label id="lblPassword">Password</label>
            <input type="password" id="inputPassword" placeholder="Masukkan password" required>

            <button type="submit" id="btnSubmit">Masuk</button>
        </form>

        <!-- Pesan Error -->
        <div id="errorMessage" style="color: red; display: none; margin-top: 10px;"></div>

        <div class="divider">atau</div>

        <!-- Tombol Google -->
        <button type="button" class="google-btn" onclick="loginWithGoogle()">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
            <span id="txtGoogleBtn">Lanjutkan dengan Google</span>
        </button>

        <p><span id="txtSwitch">Belum punya akun?</span> <a href="register.html" id="linkSwitch">Daftar sekarang</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
